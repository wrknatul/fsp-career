# nginx for the static Vue build. Installed as /etc/nginx/conf.d/default.conf,
# so this file lives in the `http` context (a top-level `map` is allowed here).

# Keep the scheme reported by an upstream TLS proxy (Caddy and similar),
# fall back to our own scheme when there is none.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Resume upload is limited to 2 MB by the API; 3 MB leaves room for the
    # multipart envelope. A larger body is rejected here with 413.
    client_max_body_size 3m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Docker's embedded DNS. With a variable in proxy_pass the name `backend`
    # is re-resolved every few seconds, so recreating the backend container
    # (new IP) does not require restarting this one.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API: everything under /api/ (including /api/docs) goes to the backend.
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Vite puts a content hash into every file name under /assets/,
    # so these files can be cached "forever".
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The entry point must always be re-fetched, otherwise users keep an old
    # index.html that points at deleted hashed files after an update.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA: unknown paths (/candidate/offers, /employer/search...) fall back
    # to index.html and vue-router takes over.
    location / {
        try_files $uri /index.html;
    }
}
