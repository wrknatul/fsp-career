# FSP.Career: database + API + web.
#
# `docker compose up --build` works without a .env file: every value below has
# a default. Copy .env.example to .env to override anything.
#
# Host ports 5432 and 8000 are deliberately never published (they are often
# taken on a developer machine). Defaults: web 8088, API 8100, PostgreSQL 5544.

name: fsp-career

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fsp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fsp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-fsp_career}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bound to localhost by default: the database is not meant to be public.
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5544}:5432"
    healthcheck:
      # $$ is escaped on purpose: the variables are resolved inside the container.
      # `-h 127.0.0.1` forces a TCP check. Without it pg_isready probes the unix
      # socket, and on the very first start (empty volume) the image entrypoint
      # runs a temporary server that listens on the socket only; the database
      # would be reported healthy before it accepts TCP connections from backend.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fsp}:${POSTGRES_PASSWORD:-fsp_dev_password}@db:5432/${POSTGRES_DB:-fsp_career}
      # Local demo default only. Must be replaced on a server (see README).
      # Kept equal to the application's own default (app/core/config.py), so
      # the application also logs its "default secret" warning on startup.
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me-0123456789}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-720}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      # Shortened from the application default (1440) so the demo can retake a test.
      TEST_COOLDOWN_MINUTES: ${TEST_COOLDOWN_MINUTES:-10}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2097152}
      FSP_REGISTRY_MODE: ${FSP_REGISTRY_MODE:-mock}
      FSP_MOCK_ROUTES_ENABLED: ${FSP_MOCK_ROUTES_ENABLED:-true}
      # No value on purpose: the browser talks to the API through the web
      # container (same origin), so CORS is only needed for an unusual setup.
      # Passed through from .env / the shell when set; otherwise the
      # application default applies (localhost 5173 and 8088).
      CORS_ORIGINS:
    ports:
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8100}:8000"
    healthcheck:
      # The slim Python image has no curl; a urllib one-liner is enough.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      # The first start applies migrations and seeds demo data.
      start_period: 60s

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8088}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
